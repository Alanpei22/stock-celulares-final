<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carga rápida de costos · Repuestos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0F0F10; color: #F2F2F7;
      padding: 18px 16px 100px; min-height: 100vh;
      max-width: 560px; margin: 0 auto;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; gap: 10px;
    }
    h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; flex: 1; }
    h1 .accent { color: #C8965A; }
    .back-btn {
      background: #2E2E31; color: #F2F2F7; border: none;
      border-radius: 10px; padding: 8px 12px;
      font-size: .85rem; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-block;
    }
    .filters { display: flex; gap: 6px; margin-bottom: 12px; }
    .fbtn {
      flex: 1; padding: 9px; border-radius: 99px;
      background: transparent; border: 1px solid rgba(255,255,255,0.12);
      color: #A1A1A6; font-size: .82rem; font-weight: 600;
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .fbtn:hover { background: rgba(255,255,255,0.04); }
    .fbtn-active {
      background: #C8965A !important; color: #fff !important; border-color: #C8965A !important;
    }
    .progress-wrap {
      background: #1E1E20; border-radius: 99px; height: 8px;
      overflow: hidden; margin-bottom: 12px;
    }
    .progress-bar {
      height: 100%; background: linear-gradient(90deg, #C8965A, #D4A76A);
      transition: width .3s ease; border-radius: 99px;
    }
    .progress-text {
      font-size: .78rem; color: #A1A1A6; text-align: center; margin-bottom: 12px;
    }
    .card {
      background: #161618; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 18px;
    }
    .card-tag {
      display: inline-block; padding: 3px 10px; border-radius: 99px;
      background: rgba(200,150,90,0.15); color: #E5C38A;
      font-size: .68rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .card-name {
      font-size: 1.1rem; font-weight: 800; line-height: 1.25;
      margin-bottom: 4px; color: #F2F2F7;
    }
    .card-meta {
      font-size: .78rem; color: #A1A1A6; font-weight: 500;
      margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 12px;
    }
    .card-meta span { display: inline-flex; align-items: center; gap: 3px; }
    .stock-low  { color: #fbbf24; }
    .stock-zero { color: #f87171; }
    .stock-ok   { color: #86efac; }

    .field { margin-bottom: 14px; }
    .field-label {
      font-size: .8rem; font-weight: 700; color: #A1A1A6;
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 6px;
    }
    .hint { font-size: .72rem; color: #6E6E73; font-weight: 500; }
    .hint--good { color: #86efac; font-weight: 700; }
    .hint--bad  { color: #f87171; font-weight: 700; }
    .input-wrap { position: relative; }
    .currency-prefix {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 1rem; font-weight: 700; color: #6E6E73; pointer-events: none;
    }
    .field-input {
      width: 100%;
      padding: 14px 14px 14px 38px;
      font-size: 1.2rem; font-weight: 700;
      background: #0A0A0B; color: #F2F2F7;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      outline: none;
      transition: border-color .15s, background .15s;
      font-family: inherit;
    }
    .field-input:focus { border-color: #C8965A; background: #1A1A1C; }
    .field-input::-webkit-outer-spin-button,
    .field-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .quick-margin {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    }
    .qm-chip {
      padding: 5px 10px; border-radius: 99px;
      background: rgba(200,150,90,0.10);
      border: 1px solid rgba(200,150,90,0.25);
      color: #E5C38A;
      font-size: .72rem; font-weight: 700; cursor: pointer;
      transition: all .15s; font-family: inherit;
    }
    .qm-chip:hover { background: rgba(200,150,90,0.2); }
    .qm-chip:disabled { opacity: 0.35; cursor: default; }

    .actions {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, transparent, #0F0F10 30%);
      padding: 14px 16px 18px;
      display: flex; gap: 8px; max-width: 560px; margin: 0 auto;
    }
    .btn-prev {
      flex: 0 0 auto; padding: 14px 16px;
      background: #2E2E31; color: #F2F2F7;
      border: none; border-radius: 12px;
      font-size: .9rem; font-weight: 700; cursor: pointer;
      font-family: inherit;
    }
    .btn-prev:hover { background: #3A3A3C; }
    .btn-prev:disabled { opacity: 0.35; cursor: default; }
    .btn-skip {
      flex: 0 0 auto; padding: 14px 14px;
      background: transparent; color: #A1A1A6;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      font-size: .85rem; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .btn-skip:hover { background: rgba(255,255,255,0.04); }
    .btn-next {
      flex: 1; padding: 14px;
      background: #22c55e; color: #fff; border: none;
      border-radius: 12px;
      font-size: .95rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 3px 12px rgba(34,197,94,0.35);
      transition: all .15s;
      font-family: inherit;
    }
    .btn-next:hover { background: #16a34a; }
    .btn-next:active { transform: scale(.98); }

    .done {
      text-align: center; padding: 60px 20px;
      background: #161618; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
    }
    .done h2 { font-size: 1.5rem; font-weight: 900; margin-bottom: 8px; }
    .done p { color: #A1A1A6; margin-bottom: 16px; }

    .auth-msg {
      padding: 14px; border-radius: 12px;
      background: #1c1917; color: #fbbf24;
      font-size: .85rem; margin-bottom: 14px;
    }

    .keyboard-hint {
      text-align: center; font-size: .7rem; color: #4D4D52;
      margin-top: 14px; font-style: italic;
    }
    .keyboard-hint kbd {
      background: #1E1E20; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px; padding: 1px 6px; font-family: monospace;
      font-size: .7rem; color: #A1A1A6;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn">← Volver</a>
  <h1>💵 Carga de <span class="accent">costos</span></h1>
</div>

<div id="auth-status" class="auth-msg">⏳ Verificando sesión…</div>

<div class="filters" id="filters" style="display:none">
  <button class="fbtn fbtn-active" data-filter="sin-costo" onclick="setFilter('sin-costo')">Sin cargar</button>
  <button class="fbtn" data-filter="todos" onclick="setFilter('todos')">Todos</button>
</div>

<div id="content"></div>

<div class="actions" id="actions" style="display:none">
  <button class="btn-prev" onclick="prev()" id="btn-prev">←</button>
  <button class="btn-skip" onclick="skip()">Saltar</button>
  <button class="btn-next" onclick="saveAndNext()">💾 Guardar y siguiente →</button>
</div>

<!-- Firebase + utils -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="utils.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

<script>
  let db = null;
  let allRepuestos = [];
  let queue = [];
  let idx = 0;
  let filter = 'sin-costo';
  let dolar = 0;

  const $ = id => document.getElementById(id);

  // ── Auth + carga inicial ──
  requireAuth().then(async user => {
    if (!user) return;
    db = _fbInit();
    $('auth-status').innerHTML = `✓ <b>${user.email}</b>`;
    $('auth-status').style.color = '#86efac';

    dolar = await ensureDolar(db);

    const snap = await db.collection('repuestos').orderBy('nombre').get();
    allRepuestos = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    $('filters').style.display = '';
    rebuildQueue();
    render();
  });

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.fbtn').forEach(b => {
      b.classList.toggle('fbtn-active', b.dataset.filter === f);
    });
    rebuildQueue();
    idx = 0;
    render();
  }

  function rebuildQueue() {
    if (filter === 'sin-costo') {
      queue = allRepuestos.filter(r => !r.precioCostoUSD || r.precioCostoUSD <= 0);
    } else {
      queue = [...allRepuestos];
    }
  }

  function render() {
    const total = queue.length;
    if (!total) {
      $('content').innerHTML = `
        <div class="done">
          <h2>🎉 ¡Listo!</h2>
          <p>${filter === 'sin-costo' ? 'Todos los repuestos tienen costo cargado.' : 'No hay items en esta vista.'}</p>
          <a href="index.html" class="back-btn">← Volver a la app</a>
        </div>`;
      $('actions').style.display = 'none';
      return;
    }
    if (idx >= total) idx = total - 1;
    if (idx < 0) idx = 0;

    const r = queue[idx];
    const stock = Number(r.cantidad) || 0;
    const stockMin = Number(r.stockMin) || 0;
    const stockCls = stock <= 0 ? 'stock-zero' : (stockMin > 0 && stock <= stockMin ? 'stock-low' : 'stock-ok');

    const usdActual = Number(r.precioCostoUSD) || 0;
    const ventaActual = Number(r.precioVenta) || 0;

    $('content').innerHTML = `
      <div class="progress-wrap"><div class="progress-bar" style="width: ${((idx) / total) * 100}%"></div></div>
      <div class="progress-text">${idx + 1} de ${total} · ${(total - idx - 1)} restantes</div>
      <div class="card">
        <div class="card-tag">${escapeHtml(r.tipo || 'Sin tipo')}</div>
        <div class="card-name">${escapeHtml(r.nombre || '(sin nombre)')}</div>
        <div class="card-meta">
          ${r.marca ? `<span>📱 ${escapeHtml(r.marca)}${r.modelo ? ' · ' + escapeHtml(r.modelo) : ''}</span>` : ''}
          <span class="${stockCls}">📦 Stock: ${stock}${stockMin > 0 ? ' / mín ' + stockMin : ''}</span>
          ${r.proveedor ? `<span>🏢 ${escapeHtml(r.proveedor)}</span>` : ''}
        </div>

        <div class="field">
          <div class="field-label">
            <span>💵 Costo USD</span>
            <span class="hint" id="hint-ars">${usdActual > 0 && dolar > 0 ? '≈ $' + Math.round(usdActual * dolar).toLocaleString('es-AR') : ''}</span>
          </div>
          <div class="input-wrap">
            <span class="currency-prefix">U$D</span>
            <input id="inp-usd" class="field-input" type="number" min="0" step="0.01" inputmode="decimal" value="${usdActual || ''}" placeholder="0">
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            <span>💲 Precio Venta ARS</span>
            <span class="hint" id="hint-margen">${marginHint(ventaActual, usdActual, dolar)}</span>
          </div>
          <div class="input-wrap">
            <span class="currency-prefix">$</span>
            <input id="inp-venta" class="field-input" type="number" min="0" inputmode="numeric" value="${ventaActual || ''}" placeholder="0">
          </div>
          <div class="quick-margin" id="quick-margin"></div>
        </div>
      </div>
      <div class="keyboard-hint">
        <kbd>Tab</kbd> avanzar campo · <kbd>Enter</kbd> guardar y siguiente · <kbd>←</kbd> <kbd>→</kbd> navegar
      </div>
    `;
    $('actions').style.display = '';
    $('btn-prev').disabled = idx === 0;

    // Foco automático en USD
    const usdInp = $('inp-usd');
    const ventaInp = $('inp-venta');
    setTimeout(() => { usdInp.focus(); usdInp.select(); }, 50);

    // Live hints
    usdInp.addEventListener('input', updateHints);
    ventaInp.addEventListener('input', updateHints);
    updateHints();

    // Enter para avanzar
    [usdInp, ventaInp].forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveAndNext(); }
      });
    });
  }

  function updateHints() {
    const usd = parseFloat($('inp-usd').value) || 0;
    const venta = parseFloat($('inp-venta').value) || 0;
    $('hint-ars').textContent = usd > 0 && dolar > 0
      ? '≈ $' + Math.round(usd * dolar).toLocaleString('es-AR')
      : (dolar > 0 ? '' : '(falta dólar)');
    $('hint-margen').className = 'hint';
    $('hint-margen').textContent = '';
    $('hint-margen').innerHTML = marginHint(venta, usd, dolar);
    renderQuickMargin(usd);
  }

  function marginHint(venta, usd, dolar) {
    if (!venta || !usd || !dolar) return '';
    const costoARS = usd * dolar;
    const margenPct = ((venta - costoARS) / costoARS) * 100;
    const ganancia = venta - costoARS;
    if (margenPct < 20) {
      return `<span class="hint--bad">⚠ Margen ${margenPct.toFixed(0)}% · gan. $${Math.round(ganancia).toLocaleString('es-AR')}</span>`;
    } else if (margenPct < 50) {
      return `Margen ${margenPct.toFixed(0)}% · gan. $${Math.round(ganancia).toLocaleString('es-AR')}`;
    } else {
      return `<span class="hint--good">✓ Margen ${margenPct.toFixed(0)}% · gan. $${Math.round(ganancia).toLocaleString('es-AR')}</span>`;
    }
  }

  function renderQuickMargin(usd) {
    const wrap = $('quick-margin');
    if (!wrap || !usd || !dolar) { if (wrap) wrap.innerHTML = ''; return; }
    const margins = [50, 80, 100, 150];
    wrap.innerHTML = margins.map(p => {
      const v = Math.round(usd * dolar * (1 + p/100));
      return `<button class="qm-chip" type="button" onclick="applyMargin(${p})">+${p}% → $${v.toLocaleString('es-AR')}</button>`;
    }).join('');
  }

  window.applyMargin = function(pct) {
    const usd = parseFloat($('inp-usd').value) || 0;
    if (!usd || !dolar) return;
    const v = Math.round(usd * dolar * (1 + pct/100));
    $('inp-venta').value = v;
    updateHints();
    $('inp-venta').focus();
  };

  async function saveAndNext() {
    const r = queue[idx];
    if (!r) return;
    const usd = parseFloat($('inp-usd').value) || 0;
    const venta = parseFloat($('inp-venta').value) || 0;
    const data = {};
    if (usd !== (Number(r.precioCostoUSD) || 0)) data.precioCostoUSD = usd;
    if (venta !== (Number(r.precioVenta) || 0)) data.precioVenta = venta;
    // Mantener precioCompra (legacy) sincronizado para retro-compat
    if (usd > 0 && dolar > 0) data.precioCompra = Math.round(usd * dolar);

    if (Object.keys(data).length) {
      try {
        await db.collection('repuestos').doc(r.id).update(data);
        // Actualizar localmente
        Object.assign(r, data);
      } catch (e) {
        console.error('save error:', e);
        alert('Error al guardar. Intentá de nuevo.');
        return;
      }
    }
    idx++;
    // Si fue por filtro "sin-costo" y ahora ya tiene costo, sacarlo de la queue
    if (filter === 'sin-costo' && data.precioCostoUSD > 0) {
      queue.splice(idx - 1, 1);
      idx--;
      if (idx < 0) idx = 0;
    }
    render();
  }

  function skip() {
    idx++;
    render();
  }

  function prev() {
    if (idx > 0) { idx--; render(); }
  }

  // Atajos de teclado globales
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'ArrowRight') skip();
  });

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
