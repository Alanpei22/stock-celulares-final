<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fotos del equipo · TechPoint</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  /* Pantalla del celu para sacarle fotos a un equipo del stock. Se abre
     escaneando el QR que muestra la compu (catalogo-stock.js). */
  :root { --bg:#f3f5f9; --card:#fff; --tx:#0f1b2d; --mut:#5a6577; --line:#e2e7f0; --acc:#0f2b52; --ok:#1faa53; --err:#dc2626; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a1220; --card:#111c2e; --tx:#e9eef6; --mut:#93a0b5; --line:#1f2b40; --acc:#7aa7e6; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/1.4 system-ui, -apple-system, Roboto, sans-serif; padding: 16px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }
  h1 { font-size: 15px; font-weight: 600; color: var(--mut); margin: 4px 0 2px; text-transform: uppercase; letter-spacing: .5px; }
  h2 { font-size: 26px; margin: 0 0 4px; line-height: 1.1; }
  .sub { color: var(--mut); font-size: 14px; margin: 0 0 16px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 14px; padding: 18px; font-size: 18px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
  .btn-cam { background: var(--acc); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn-cam { color: #0a1220; } }
  .btn-gal { background: var(--card); color: var(--tx); border: 1.5px solid var(--line); font-size: 16px; padding: 14px; }
  .estado { text-align: center; font-size: 14px; color: var(--mut); min-height: 20px; margin: 6px 0 14px; }
  .estado.ok { color: var(--ok); font-weight: 700; }
  .estado.err { color: var(--err); font-weight: 700; }
  .grilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grilla div { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); }
  .grilla img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grilla .port { position: absolute; left: 4px; bottom: 4px; background: #0f2b52; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
  .grilla .subiendo img { opacity: .45; }
  .grilla .subiendo::after { content: "⏳"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .aviso { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-align: center; margin-top: 30px; }
  .aviso a { color: var(--acc); font-weight: 700; }
  .tip { font-size: 13px; color: var(--mut); margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div id="cargando" class="estado">Cargando…</div>

<div id="app" class="hidden">
  <h1>📷 Fotos para la página</h1>
  <h2 id="nombre"></h2>
  <p class="sub" id="detalle"></p>

  <input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="in-gal" accept="image/*" multiple hidden>
  <button type="button" class="btn btn-cam" id="b-cam">📸 Sacar foto</button>
  <button type="button" class="btn btn-gal" id="b-gal">🖼️ Elegir de la galería</button>
  <div class="estado" id="estado"></div>

  <div class="grilla" id="grilla"></div>
  <p class="tip">Las fotos aparecen solas en la compu. La primera es la portada: se cambia desde la compu con ⭐.<br>Fondo liso, buena luz y el equipo limpio.</p>
</div>

<div id="error" class="aviso hidden"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="utils.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="fotos-celu.js"></script>
</body>
</html>
