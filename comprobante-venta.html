<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TechPoint — Generador de comprobantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0B0B0C;
    --marca:#301854;
    --acento:#FCC03C;
    --regla:#B9BEBB;
    --regla-fina:#D6DAD7;
    --label:#5F6763;
    --papel:#FFFFFF;
    --f-label:'Archivo Narrow','Roboto Condensed','Arial Narrow',sans-serif;
    --f-dato:'IBM Plex Mono','Courier New',monospace;
    --f-texto:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--f-texto);background:#0d0a14;color:#EDE7F5;-webkit-font-smoothing:antialiased}

  /* ============ LAYOUT ============ */
  .layout{min-height:100vh}
  @media(min-width:1040px){
    .layout{display:grid;grid-template-columns:clamp(400px,40vw,520px) 1fr;height:100vh;overflow:hidden}
    .app-ui{height:100vh;overflow:auto;display:flex;flex-direction:column}
    .preview-col{height:100vh;overflow:auto;background:radial-gradient(120% 100% at 50% 0%,#1a1030 0%,#0b0812 70%);display:flex;justify-content:center;align-items:flex-start;padding:28px 24px}
  }
  @media(max-width:1039px){
    .preview-col{position:fixed;inset:0;z-index:60;background:#0b0812;display:none;overflow:auto;padding:16px}
    body.show-preview .preview-col{display:flex;justify-content:center;align-items:flex-start}
    body.show-preview{overflow:hidden}
  }

  /* ============ TOPBAR ============ */
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #211836;background:#0f0b18;position:sticky;top:0;z-index:5}
  .topbar .logo{height:38px;width:auto;background:#fff;border-radius:8px;padding:3px 5px;flex:none}
  .topbar .tt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
  .topbar .tt b{font-size:14px;font-weight:700;letter-spacing:.02em}
  .topbar .tt span{font-size:11px;color:#9C87C4;letter-spacing:.14em;text-transform:uppercase}
  .topbar .nro-chip{margin-left:auto;flex:none;background:#1c1330;border:1px solid #33254f;border-radius:999px;padding:6px 12px;font-family:var(--f-dato);font-size:12px;color:var(--acento);white-space:nowrap}
  .topbar .nro-chip b{color:#EDE7F5;font-weight:500}

  /* ============ WIZARD ============ */
  .wizard{flex:1;display:flex;flex-direction:column;padding:20px;max-width:560px;width:100%;margin:0 auto}
  .progress{height:6px;background:#1a1228;border-radius:999px;overflow:hidden}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,#FCC03C,#ffd873);border-radius:999px;transition:width .25s ease}
  .pmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .psec{color:var(--acento);font-weight:600}
  .pnum{color:#7c6aa0}

  .card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0 8px;min-height:0}
  .step-en{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .q-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8a76b3;margin-bottom:8px}
  .q-title{font-size:24px;font-weight:700;line-height:1.2;margin-bottom:6px}
  .q-hint{font-size:13.5px;color:#a293c4;line-height:1.5;margin-bottom:20px}

  .field{width:100%;background:#150f22;border:1.5px solid #2b2142;border-radius:13px;padding:15px 16px;color:#fff;font-family:var(--f-texto);font-size:17px;outline:none;transition:border-color .15s, box-shadow .15s}
  .field::placeholder{color:#5c4f78}
  .field:focus{border-color:var(--acento);box-shadow:0 0 0 3px rgba(252,192,60,.16)}
  textarea.field{min-height:88px;resize:vertical;line-height:1.5}
  .field-suffix{position:relative}
  .field-suffix .sfx{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#8a76b3;font-size:15px;pointer-events:none}

  .opts{display:flex;flex-wrap:wrap;gap:10px}
  .opt-btn{flex:1 1 auto;min-width:120px;background:#150f22;border:1.5px solid #2b2142;border-radius:13px;padding:16px 18px;color:#EDE7F5;font-family:var(--f-texto);font-size:16px;font-weight:600;cursor:pointer;text-align:center;transition:all .12s}
  .opt-btn:hover{border-color:#5b4487}
  .opt-btn.sel{background:var(--acento);border-color:var(--acento);color:#1b1030}
  .opts.two .opt-btn{flex:1 1 45%}
  .opts.small .opt-btn{flex:0 0 auto;min-width:70px;font-size:16px;padding:14px 22px}

  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{background:#150f22;border:1.5px solid #2b2142;border-radius:999px;padding:10px 16px;color:#d6c9ee;font-size:14px;font-weight:500;cursor:pointer;transition:all .12s;user-select:none}
  .chip:hover{border-color:#5b4487}
  .chip.sel{background:var(--acento);border-color:var(--acento);color:#1b1030;font-weight:600}
  .chip.all{border-style:dashed;color:#FCC03C}
  .chip.all.sel{color:#1b1030;border-style:solid}
  .otros-wrap{margin-top:12px}

  .nav{display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid #1c1430}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .btn{font-family:var(--f-texto);font-size:15px;border:none;border-radius:12px;cursor:pointer;transition:all .12s}
  .btn.solid{background:var(--acento);color:#1b1030;font-weight:700;padding:13px 22px}
  .btn.solid:hover{background:#ffcf5c}
  .btn.ghost{background:transparent;border:1.5px solid #2b2142;color:#c3b2e2;padding:12px 18px;font-weight:500}
  .btn.ghost:hover{border-color:#5b4487}
  .btn.ghost:disabled{opacity:.35;cursor:default}
  .btn.link{background:none;color:#8a76b3;text-decoration:underline;padding:6px 2px;font-size:14px}
  .btn.link:hover{color:#c3b2e2}

  .mobile-preview-btn{display:none}
  @media(max-width:1039px){
    .mobile-preview-btn{display:flex;align-items:center;gap:8px;position:fixed;right:16px;bottom:16px;z-index:40;background:var(--marca);color:#fff;border:1.5px solid #4a3570;border-radius:999px;padding:12px 18px;font-family:var(--f-texto);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5)}
    .close-preview{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:2;align-self:stretch;justify-content:center;background:var(--acento);color:#1b1030;border:none;border-radius:12px;padding:12px;font-family:var(--f-texto);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:14px}
  }
  @media(min-width:1040px){.close-preview{display:none}}

  /* ============ DONE ============ */
  .done{text-align:center;animation:fade .3s ease}
  .done .ok{width:64px;height:64px;border-radius:50%;background:var(--acento);color:#1b1030;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;margin:0 auto 18px}
  .done h2{font-size:23px;font-weight:700;margin-bottom:6px}
  .done .sub{color:#a293c4;font-size:15px;margin-bottom:8px}
  .done .resumen{background:#150f22;border:1px solid #2b2142;border-radius:13px;padding:16px;text-align:left;margin:18px 0;font-size:14px;line-height:1.7}
  .done .resumen b{color:#c9bbe8}
  .done .acts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .done .acts .btn.solid{width:100%;text-align:center;padding:15px;font-size:16px}
  .done .acts .row{display:flex;gap:10px}
  .done .acts .row .btn{flex:1;text-align:center;padding:13px;font-weight:600}

  /* ============ RECEIPT (verificado, entra en 1 A4) ============ */
  .sheet-frame{flex:none}
  .sheet-scale{transform-origin:top left;width:210mm;height:297mm}
  .pliego{width:210mm;height:297mm;background:var(--papel);display:flex;flex-direction:column;box-shadow:0 4mm 22mm rgba(0,0,0,.55);position:relative;color:var(--tinta)}
  .pliego::after{content:"";position:absolute;top:148.5mm;left:0;right:0;border-top:0.25mm dashed #C4C9C6}
  .mitad{width:210mm;height:148.5mm;padding:3.5mm;display:flex;flex-direction:column;gap:1.2mm;flex:none;overflow:hidden}

  .cabecera{display:flex;border:0.4mm solid var(--marca);flex:none}
  .marca{background:var(--marca);color:#fff;padding:1.6mm 2.2mm;flex:1;display:flex;align-items:center;gap:2.4mm;min-width:0}
  .logo-img{height:11mm;width:auto;background:#fff;border-radius:1.4mm;padding:.8mm 1.2mm;flex:none}
  .marca-txt{display:flex;flex-direction:column;gap:.6mm;min-width:0}
  .rubro{font-family:var(--f-label);font-size:4.2pt;letter-spacing:.2em;text-transform:uppercase;color:#B388D4}
  .contacto{font-family:var(--f-dato);font-size:4.2pt;color:#DCD2EA;line-height:1.35}
  .folio{width:62mm;padding:1.2mm 2mm;display:flex;flex-direction:column;justify-content:center;gap:.7mm;border-left:0.4mm solid var(--marca);flex:none}
  .rol-copia{font-family:var(--f-label);font-weight:700;font-size:4.2pt;letter-spacing:.16em;text-transform:uppercase;color:var(--marca);background:var(--acento);padding:.2mm 1.2mm;align-self:flex-start}
  .folio-titulo{font-family:var(--f-label);font-weight:700;font-size:6.6pt;line-height:1.05;text-transform:uppercase}
  .folio-linea{display:flex;gap:2.2mm;align-items:baseline}
  .folio-linea span{display:flex;align-items:baseline;gap:.8mm;flex:1}
  .folio-linea b{font-family:var(--f-label);font-size:4.6pt;letter-spacing:.1em;color:var(--label);text-transform:uppercase}
  .folio-linea i{font-style:normal;flex:1;border-bottom:0.3mm solid var(--marca);height:3.6mm;display:inline-flex;align-items:flex-end;justify-content:flex-start;overflow:hidden;white-space:nowrap;font-family:var(--f-texto);font-weight:600;font-size:5.8pt;color:#141018;padding-bottom:.2mm}
  .folio-linea .nro{flex:0 0 22mm}

  .seccion{border:0.25mm solid var(--regla);border-top:none;flex:none}
  .barra{background:var(--marca);color:#fff;display:flex;align-items:center;gap:1.4mm;padding:.6mm 1.6mm}
  .barra em{font-style:normal;font-family:var(--f-dato);font-size:4.6pt;font-weight:600;color:var(--marca);background:var(--acento);padding:.2mm 1mm;border-radius:.4mm}
  .barra h2{font-family:var(--f-label);font-weight:600;font-size:5.4pt;letter-spacing:.18em;text-transform:uppercase}
  .barra small{margin-left:auto;font-family:var(--f-label);font-size:4.2pt;letter-spacing:.1em;text-transform:uppercase;color:#A88FC4}
  .cuerpo{padding:1.4mm 1.6mm 1.6mm}

  .fila{display:flex;gap:2.2mm;margin-bottom:1.3mm}
  .fila:last-child{margin-bottom:0}
  .campo{flex:1;display:flex;flex-direction:column;gap:.3mm;min-width:0}
  .campo>label{font-family:var(--f-label);font-size:4.4pt;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
  .linea{height:4.4mm;border-bottom:0.25mm solid var(--regla);position:relative}
  .linea .val{position:absolute;left:.6mm;right:1mm;bottom:.5mm;font-family:var(--f-texto);font-weight:600;font-size:6.2pt;color:#141018;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
  .w-xs{flex:0 0 14mm}.w-sm{flex:0 0 18mm}.w-md{flex:0 0 24mm}.w-lg{flex:0 0 32mm}

  .digitos{display:flex;gap:0}
  .digitos i{font-style:normal;width:4.2mm;height:4.2mm;border:0.2mm solid var(--regla);border-left:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-dato);font-weight:600;font-size:6.4pt;color:#141018}
  .digitos i:first-child{border-left:0.2mm solid var(--regla)}
  .digitos i:nth-child(3n){border-right:0.35mm solid var(--marca)}
  .digitos i:last-child{border-right:0.2mm solid var(--regla)}

  .opciones{display:flex;flex-wrap:wrap;gap:.6mm 2.2mm;align-items:center;padding-top:.4mm}
  .op{display:flex;align-items:center;gap:.9mm;font-family:var(--f-label);font-size:5.2pt;letter-spacing:.02em;white-space:nowrap}
  .op::before{content:"";width:2.3mm;height:2.3mm;border:0.25mm solid var(--tinta);flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .op.marcado::before{content:"✓";background:var(--marca);border-color:var(--marca);color:#fff;font-size:1.8mm;font-weight:700}
  .op .rellenar{display:inline-block;min-width:11mm;border-bottom:0.25mm dotted var(--regla);height:2.8mm;text-align:center;font-family:var(--f-texto);font-weight:600;font-size:5.6pt;color:#141018;line-height:2.8mm;vertical-align:bottom}

  .grilla-test{display:grid;grid-template-columns:repeat(8,1fr);gap:1.4mm}
  .test{display:flex;align-items:center;gap:.9mm;font-family:var(--f-label);font-size:5pt;white-space:nowrap}
  .test::before{content:"";width:2.5mm;height:2.5mm;border:0.25mm solid var(--tinta);flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .test.marcado::before{content:"✓";background:var(--marca);border-color:var(--marca);color:#fff;font-size:1.9mm;font-weight:700}

  .condiciones{columns:4;column-gap:3.4mm;column-rule:0.2mm solid var(--regla-fina)}
  .condiciones p{font-size:4.5pt;line-height:1.3;text-align:justify;margin-bottom:.8mm;break-inside:avoid;color:#1E2321}
  .condiciones p:last-child{margin-bottom:0}
  .condiciones p strong{font-family:var(--f-label);font-weight:700;font-size:4.7pt;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta)}
  .condiciones .destacado{border-left:0.6mm solid var(--marca);padding-left:1.2mm}

  .cierre{margin-top:auto;display:flex;gap:3.4mm;align-items:flex-end;padding-top:1.6mm;flex:none}
  .observaciones{flex:1;display:flex;flex-direction:column;gap:.3mm}
  .observaciones label{font-family:var(--f-label);font-size:4.4pt;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
  .observaciones .renglon{height:3.8mm;border-bottom:0.25mm dotted var(--regla);position:relative}
  .observaciones .renglon .val{position:absolute;left:.6mm;right:1mm;bottom:.4mm;font-family:var(--f-texto);font-weight:600;font-size:5.6pt;color:#141018;white-space:nowrap;overflow:hidden}
  .firmas{flex:0 0 106mm;display:flex;gap:4mm}
  .firma{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:.5mm}
  .firma .espacio{height:9.5mm}
  .firma .rubrica{border-top:0.3mm solid var(--tinta);padding-top:.7mm}
  .firma .rol{font-family:var(--f-label);font-size:4.8pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .firma .aclara{font-family:var(--f-label);font-size:4.1pt;letter-spacing:.05em;text-transform:uppercase;color:var(--label);line-height:1.45}

  /* ============ PRINT ============ */
  @media print{
    @page{size:A4 portrait;margin:0}
    body{background:#fff}
    .app-ui,.mobile-preview-btn,.close-preview{display:none!important}
    .layout{display:block!important}
    .preview-col{position:static!important;display:block!important;padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important;height:auto!important}
    .sheet-frame{width:auto!important;height:auto!important}
    .sheet-scale{transform:none!important;width:auto!important;height:auto!important}
    .pliego{box-shadow:none!important;page-break-after:avoid;break-after:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

<script>
/* ============ ESTADO ============ */
const state = {
  nro:'', fecha:'', hora:'', nombre:'', dni:'', tel:'',
  modelo:'', capacidad:'', color:'', serie:'', imei1:'', imei2:'', bateria:'', ciclos:'',
  condicion:'', estetico:'', red:null, cuentas:null, accesorios:[], accesoriosOtros:'',
  pruebas:[], precio:'', pago:'', cuotas:'', permuta:'', valorTomado:'', saldo:'', obs:''
};

/* ============ PERSISTENCIA (con fallback si el navegador la bloquea) ============ */
const KEY='techpoint_entrega_v1';
let mem={};
function loadStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return mem; } }
function saveStore(o){ mem=o; try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

/* ============ INIT ============ */
function pad(n){return String(n).padStart(2,'0');}
(function init(){
  const st=loadStore();
  state.nro = st.nextNro!=null ? String(st.nextNro) : '1';
  const d=new Date();
  state.fecha = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  state.hora  = pad(d.getHours())+':'+pad(d.getMinutes());
  // Prefill desde Caja: autocompleta con los datos del equipo elegido
  try{
    const pf=JSON.parse(localStorage.getItem('techpoint_prefill')||'null');
    if(pf){
      ['modelo','capacidad','color','serie','imei1','imei2','bateria','precio'].forEach(function(k){
        if(pf[k]!=null && pf[k]!=='') state[k]=String(pf[k]);
      });
      localStorage.removeItem('techpoint_prefill');
    }
  }catch(e){}
})();

/* ============ CLONAR RECIBO x2 ============ */
const pliego=document.getElementById('pliego');
['Original — Cliente','Duplicado — TechPoint'].forEach(rol=>{
  const n=document.getElementById('tpl').content.cloneNode(true);
  n.querySelector('.rol-copia').textContent=rol;
  pliego.appendChild(n);
});

/* ============ FORMATTERS ============ */
function money(v){ if(v===''||v==null) return ''; const n=Number(String(v).replace(/[^\d]/g,'')); if(!n) return ''; return '$ '+n.toLocaleString('es-AR'); }
function fFecha(v){ if(!v) return ''; const p=v.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : v; }
const FMT={ precio:money, valorTomado:money, saldo:money, fecha:fFecha };

/* ============ BIND RECIBO ============ */
function marked(field,val){
  switch(field){
    case 'condicion': return state.condicion===val;
    case 'estetico': return state.estetico===val;
    case 'pago': return state.pago===val;
    case 'red': return state.red===true;
    case 'cuentas': return state.cuentas===true;
    case 'accesorios': return val==='Otros' ? !!state.accesoriosOtros : state.accesorios.includes(val);
    case 'pruebas': return state.pruebas.includes(val);
  }
  return false;
}
function updateReceipt(){
  document.querySelectorAll('[data-field]').forEach(el=>{
    const f=el.dataset.field;
    el.textContent = FMT[f] ? FMT[f](state[f]) : (state[f]||'');
  });
  ['imei1','imei2'].forEach(k=>{
    const s=(state[k]||'').replace(/\D/g,'').slice(0,15);
    document.querySelectorAll('[data-imei="'+k+'"]').forEach(cont=>{
      const boxes=cont.querySelectorAll('i');
      boxes.forEach((b,i)=> b.textContent = s[i]||'');
    });
  });
  document.querySelectorAll('[data-opt]').forEach(el=>{
    const [f,v]=el.dataset.opt.split(':');
    el.classList.toggle('marcado', marked(f,v));
  });
  document.getElementById('chipNro').textContent = state.nro||'—';
}

/* ============ PASOS ============ */
const steps=[
  {sec:'Comprobante', f:'nro', t:'Número de comprobante', type:'text', hint:'Se sugiere el siguiente automáticamente. Podés cambiarlo.'},
  {sec:'Comprobante', f:'fecha', t:'Fecha de entrega', type:'date'},
  {sec:'Comprobante', f:'hora', t:'Hora', type:'time'},
  {sec:'Cliente', f:'nombre', t:'Apellido y nombre del cliente', type:'text', ph:'Ej: Pérez, Juan'},
  {sec:'Cliente', f:'dni', t:'DNI', type:'num', opt:true},
  {sec:'Cliente', f:'tel', t:'Teléfono', type:'tel', opt:true, ph:'Ej: 11 2345-6789'},
  {sec:'Equipo', f:'modelo', t:'Marca y modelo', type:'text', ph:'Ej: iPhone 13 Pro'},
  {sec:'Equipo', f:'capacidad', t:'Capacidad', type:'text', opt:true, ph:'Ej: 128 GB'},
  {sec:'Equipo', f:'color', t:'Color', type:'text', opt:true},
  {sec:'Equipo', f:'serie', t:'N° de serie', type:'text', opt:true},
  {sec:'Equipo', f:'imei1', t:'IMEI 1', type:'imei', hint:'Marcá *#06# en el equipo. 15 dígitos.'},
  {sec:'Equipo', f:'imei2', t:'IMEI 2 / eSIM', type:'imei', opt:true, hint:'Si el equipo es dual SIM. Podés omitirlo.'},
  {sec:'Equipo', f:'bateria', t:'Salud de batería', type:'num', opt:true, sfx:'%', hint:'Sobre todo en usados.'},
  {sec:'Equipo', f:'ciclos', t:'Ciclos de batería', type:'num', opt:true},
  {sec:'Estado', f:'condicion', t:'¿Condición del equipo?', type:'choice', options:['Nuevo','Usado']},
  {sec:'Estado', f:'estetico', t:'Estado estético', type:'choice', small:true, opt:true, options:['A','B','C'], hint:'A: impecable · B: buen estado · C: con marcas de uso'},
  {sec:'Estado', f:'red', t:'¿Está libre de fábrica?', type:'yesno'},
  {sec:'Estado', f:'cuentas', t:'¿iCloud / Google removido y verificado?', type:'yesno', hint:'Verificado en el local, delante del cliente.'},
  {sec:'Estado', f:'accesorios', t:'Accesorios que se entregan', type:'multi', opt:true, options:['Caja','Cargador','Cable','Auriculares','Vidrio','Funda'], otros:true},
  {sec:'Estado', f:'pruebas', t:'Funciones probadas en el mostrador', type:'multi', opt:true, all:true, options:['Pantalla','Táctil','Cámaras','Audio','Micrófono','Botones','Wi-Fi y señal','Carga'], hint:'Tildá lo que probaste con el cliente.'},
  {sec:'Operación', f:'precio', t:'Precio total', type:'money'},
  {sec:'Operación', f:'pago', t:'Forma de pago', type:'choice', options:['Efectivo','Transferencia','Débito','Crédito']},
  {sec:'Operación', f:'cuotas', t:'¿Cuántas cuotas?', type:'num', opt:true, showIf:s=>s.pago==='Crédito'},
  {sec:'Operación', f:'permuta', t:'¿Hay permuta? Equipo recibido', type:'text', opt:true, ph:'Modelo e IMEI · dejá vacío si no hay', hint:'Si tomás un equipo en parte de pago.'},
  {sec:'Operación', f:'valorTomado', t:'Valor tomado por la permuta', type:'money', opt:true, showIf:s=>!!s.permuta},
  {sec:'Operación', f:'saldo', t:'Saldo abonado', type:'money', opt:true, showIf:s=>!!s.permuta},
  {sec:'Operación', f:'obs', t:'Observaciones', type:'textarea', opt:true, ph:'Opcional'}
];
const REQUIRED=['nro','nombre','modelo','imei1','condicion','red','cuentas','precio'];

let idx=0;
function applicable(i){ const st=steps[i]; return !st.showIf || st.showIf(state); }
function firstStep(){ idx=0; while(idx<steps.length && !applicable(idx)) idx++; }
function total(){ return steps.filter((s,i)=>applicable(i)).length; }
function posOf(i){ let p=0; for(let k=0;k<=i;k++) if(applicable(k)) p++; return p; }

/* ============ RENDER ============ */
const card=document.getElementById('card');
const btnBack=document.getElementById('btnBack');
const btnNext=document.getElementById('btnNext');
const btnSkip=document.getElementById('btnSkip');
let done=false;

function render(){
  done=false;
  const st=steps[idx];
  document.getElementById('psec').textContent=st.sec;
  document.getElementById('pnum').textContent='Paso '+posOf(idx)+' de '+total();
  document.getElementById('pfill').style.width=(posOf(idx)/total()*100)+'%';
  btnBack.disabled = idx===0;
  btnSkip.style.display = st.opt ? 'inline' : 'none';
  btnNext.style.display='inline';
  btnNext.textContent = (posOf(idx)===total()) ? 'Finalizar ✓' : 'Siguiente →';

  card.className='card step-en';
  let h='<div class="q-kicker">'+st.sec+'</div><div class="q-title">'+st.t+'</div>';
  if(st.hint) h+='<div class="q-hint">'+st.hint+'</div>'; else h+='<div style="height:6px"></div>';

  if(st.type==='choice'){
    h+='<div class="opts'+(st.small?' small':'')+(st.options.length===2?' two':'')+'">';
    st.options.forEach(o=> h+='<button class="opt-btn'+(state[st.f]===o?' sel':'')+'" data-v="'+o+'">'+o+'</button>');
    h+='</div>';
    btnNext.style.display = state[st.f] ? 'inline' : 'none';
  } else if(st.type==='yesno'){
    const yes=state[st.f]===true, no=state[st.f]===false;
    h+='<div class="opts two"><button class="opt-btn'+(yes?' sel':'')+'" data-v="si">Sí</button><button class="opt-btn'+(no?' sel':'')+'" data-v="no">No</button></div>';
    btnNext.style.display = (state[st.f]!==null) ? 'inline' : 'none';
  } else if(st.type==='multi'){
    h+='<div class="chips">';
    if(st.all) h+='<span class="chip all'+(state[st.f].length===st.options.length?' sel':'')+'" data-all="1">Todas</span>';
    st.options.forEach(o=> h+='<span class="chip'+(state[st.f].includes(o)?' sel':'')+'" data-c="'+o+'">'+o+'</span>');
    h+='</div>';
    if(st.otros) h+='<div class="otros-wrap"><input class="field" id="otrosInp" placeholder="Otros (especificar)" value="'+(state.accesoriosOtros||'').replace(/"/g,'&quot;')+'"></div>';
  } else if(st.type==='textarea'){
    h+='<textarea class="field" id="inp" placeholder="'+(st.ph||'')+'">'+(state[st.f]||'')+'</textarea>';
  } else {
    const t = st.type==='date'?'date' : st.type==='time'?'time' : 'text';
    const im = (st.type==='num'||st.type==='imei'||st.type==='money'||st.type==='tel') ? ' inputmode="numeric"' : '';
    let val = state[st.f]||'';
    if(st.type==='money') val = money(state[st.f]);
    const wrap = st.sfx ? 'field-suffix' : '';
    h+='<div class="'+wrap+'"><input class="field" id="inp" type="'+t+'"'+im+' placeholder="'+(st.ph||'')+'" value="'+String(val).replace(/"/g,'&quot;')+'">'+(st.sfx?'<span class="sfx">'+st.sfx+'</span>':'')+'</div>';
  }
  card.innerHTML=h;

  // listeners
  card.querySelectorAll('.opt-btn').forEach(b=> b.onclick=()=>{
    const v=b.dataset.v;
    if(st.type==='yesno') state[st.f] = (v==='si');
    else state[st.f]=v;
    updateReceipt(); next();
  });
  card.querySelectorAll('.chip').forEach(c=> c.onclick=()=>{
    if(c.dataset.all){
      state[st.f] = state[st.f].length===st.options.length ? [] : st.options.slice();
    } else {
      const o=c.dataset.c, arr=state[st.f], i=arr.indexOf(o);
      if(i>=0) arr.splice(i,1); else arr.push(o);
    }
    updateReceipt(); render();
  });
  const otros=document.getElementById('otrosInp');
  if(otros) otros.oninput=()=>{ state.accesoriosOtros=otros.value; updateReceipt(); };
  const inp=document.getElementById('inp');
  if(inp){
    inp.focus();
    inp.oninput=()=>{
      let v=inp.value;
      if(st.type==='num') { v=v.replace(/\D/g,''); inp.value=v; }
      if(st.type==='imei'){ v=v.replace(/\D/g,'').slice(0,15); inp.value=v; }
      if(st.type==='money'){ const d=v.replace(/[^\d]/g,''); state[st.f]=d; inp.value=money(d); updateReceipt(); return; }
      state[st.f]=v; updateReceipt();
    };
    if(st.type!=='textarea') inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); next(); } };
    else inp.onkeydown=e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); next(); } };
  }
}

function isEmpty(f){ const v=state[f]; if(Array.isArray(v)) return v.length===0; return v===''||v==null; }

function next(){
  const st=steps[idx];
  if(REQUIRED.includes(st.f) && isEmpty(st.f)){
    const el=document.getElementById('inp')||card.querySelector('.opts,.chips');
    if(el){ el.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220}); if(el.focus)el.focus(); }
    return;
  }
  let j=idx+1; while(j<steps.length && !applicable(j)) j++;
  if(j>=steps.length){ showDone(); return; }
  idx=j; render();
}
function prev(){
  let j=idx-1; while(j>=0 && !applicable(j)) j--;
  if(j<0) return; idx=j; done=false; render();
}
btnNext.onclick=next;
btnBack.onclick=()=>{ if(done){ done=false; render(); } else prev(); };
btnSkip.onclick=()=>{ const st=steps[idx]; if(st.type!=='multi'){ /* dejar vacío */ } next(); };

/* ============ DONE ============ */
function bumpCounter(){
  const st=loadStore();
  const cur=parseInt(String(state.nro).replace(/\D/g,''))||0;
  st.nextNro=cur+1; saveStore(st);
}
function showDone(){
  done=true; bumpCounter();
  document.getElementById('pfill').style.width='100%';
  document.getElementById('pnum').textContent='Completo';
  document.getElementById('psec').textContent='Listo';
  btnBack.disabled=false; btnSkip.style.display='none'; btnNext.style.display='none';
  card.className='card';
  const eq=[state.modelo,state.capacidad].filter(Boolean).join(' · ');
  card.innerHTML=
    '<div class="done">'+
      '<div class="ok">✓</div>'+
      '<h2>Comprobante N° '+(state.nro||'')+' listo</h2>'+
      '<div class="sub">'+(state.nombre||'Sin nombre')+'</div>'+
      '<div class="resumen">'+
        (eq?'<div><b>Equipo:</b> '+eq+'</div>':'')+
        (state.imei1?'<div><b>IMEI:</b> '+state.imei1+'</div>':'')+
        (state.precio?'<div><b>Precio:</b> '+money(state.precio)+(state.pago?' · '+state.pago:'')+'</div>':'')+
        '<div><b>Fecha:</b> '+fFecha(state.fecha)+' '+state.hora+'</div>'+
      '</div>'+
      '<div class="acts">'+
        '<button class="btn solid" id="btnPrint">🖨 Imprimir / Guardar PDF</button>'+
        '<div class="row">'+
          '<button class="btn ghost" id="btnEdit">✏ Editar datos</button>'+
          '<button class="btn ghost" id="btnNew">＋ Nuevo comprobante</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.getElementById('btnPrint').onclick=()=>window.print();
  document.getElementById('btnEdit').onclick=()=>{ done=false; firstStep(); render(); };
  document.getElementById('btnNew').onclick=()=>{
    const st=loadStore();
    Object.assign(state,{nombre:'',dni:'',tel:'',modelo:'',capacidad:'',color:'',serie:'',imei1:'',imei2:'',bateria:'',ciclos:'',condicion:'',estetico:'',red:null,cuentas:null,accesorios:[],accesoriosOtros:'',pruebas:[],precio:'',pago:'',cuotas:'',permuta:'',valorTomado:'',saldo:'',obs:''});
    state.nro = st.nextNro!=null ? String(st.nextNro) : String((parseInt(state.nro)||0)+1);
    const d=new Date(); state.fecha=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); state.hora=pad(d.getHours())+':'+pad(d.getMinutes());
    updateReceipt(); firstStep(); render();
  };
}

/* ============ PREVIEW SCALE ============ */
const NAT_W=793.7, NAT_H=1122.52;
function scaleFit(){
  const col=document.querySelector('.preview-col');
  const scale=document.getElementById('scale');
  const frame=document.getElementById('frame');
  const avail=col.clientWidth - 48;
  let s=Math.min(1, avail/NAT_W);
  if(s<=0) s=0.3;
  scale.style.transform='scale('+s+')';
  frame.style.width=(NAT_W*s)+'px';
  frame.style.height=(NAT_H*s)+'px';
}
window.addEventListener('resize',scaleFit);

/* ============ MOBILE PREVIEW TOGGLE ============ */
document.getElementById('btnPrev').onclick=()=>{ document.body.classList.add('show-preview'); scaleFit(); };
document.getElementById('btnClose').onclick=()=>{ document.body.classList.remove('show-preview'); };
