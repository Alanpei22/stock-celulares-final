<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Pedido de Módulos</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #273549;
      --border: #334155;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --accent: #3b82f6;
      --accent2: #1d4ed8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .header-top h1 { font-size: 1.1rem; flex: 1; }
    .badge-pedido {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 24px;
      text-align: center;
    }
    .btn-ver-pedido {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-ver-pedido:hover { background: var(--accent2); }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filters input, .filters select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.85rem;
    }
    .filters input { flex: 1; min-width: 140px; }
    .filters select { min-width: 130px; }
    .filters input:focus, .filters select:focus { outline: none; border-color: var(--accent); }

    .total-bar {
      padding: 6px 16px;
      font-size: 0.8rem;
      color: var(--text2);
      background: var(--bg);
    }

    .list { padding: 8px 12px 80px; }

    .marca-group { margin-bottom: 4px; }
    .marca-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 10px 4px 4px;
    }

    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.15s;
    }
    .item.selected { border-color: var(--accent); background: #1e3a5f; }
    .item-info { flex: 1; min-width: 0; }
    .item-modelo { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-detalle { font-size: 0.75rem; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-precio { font-size: 0.85rem; font-weight: 700; color: var(--yellow); white-space: nowrap; }

    .qty-ctrl { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 30px; height: 30px;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .qty-btn:active { background: var(--accent); }
    .qty-val {
      width: 28px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Modal pedido */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-height: 80dvh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .modal-header h2 { flex: 1; font-size: 1rem; }
    .modal-close {
      background: var(--surface2);
      border: none;
      color: var(--text2);
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .pedido-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      gap: 8px;
    }
    .pedido-item:last-child { border-bottom: none; }
    .pedido-item-nombre { flex: 1; }
    .pedido-item-qty { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .pedido-empty { text-align: center; color: var(--text2); padding: 32px; font-size: 0.9rem; }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    .btn-limpiar {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-copiar {
      flex: 1;
      background: var(--green);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-whatsapp {
      background: #25d366;
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-copiar:active, .btn-whatsapp:active { opacity: 0.8; }

    .empty-list { text-align: center; color: var(--text2); padding: 48px 16px; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>📦 Pedido de Módulos</h1>
    <button class="btn-ver-pedido" onclick="abrirModal()">
      🛒 Ver pedido <span class="badge-pedido" id="badge">0</span>
    </button>
  </div>
  <div class="filters">
    <input type="search" id="buscador" placeholder="🔍 Buscar modelo..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <select id="filtro-marca">
      <option value="">Todas las marcas</option>
    </select>
  </div>
</header>

<div class="total-bar" id="total-bar">Cargando...</div>
<div class="list" id="list"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="e => { if(e.target===this) cerrarModal(); }">
  <div class="modal">
    <div class="modal-header">
      <h2>🛒 Mi Pedido</h2>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-limpiar" onclick="limpiarPedido()">Limpiar</button>
      <button class="btn-copiar" onclick="copiarPedido()">📋 Copiar</button>
      <button class="btn-whatsapp" onclick="enviarWhatsApp()">WhatsApp</button>
    </div>
  </div>
</div>

<script>
let ITEMS = [];
let pedido = {}; // key -> cantidad

async function init() {
  const res = await fetch('pedido_data.json');
  ITEMS = await res.json();

  // Normalizar marcas
  ITEMS.forEach(it => it.marca = it.marca.trim().toUpperCase().replace(/\s+/g, ' '));

  // Cargar marcas en select
  const marcas = [...new Set(ITEMS.map(i => i.marca))].sort();
  const sel = document.getElementById('filtro-marca');
  marcas.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m.charAt(0) + m.slice(1).toLowerCase();
    sel.appendChild(opt);
  });

  document.getElementById('buscador').addEventListener('input', render);
  sel.addEventListener('change', render);

  render();
}

function key(it, idx) { return idx; }

function filteredItems() {
  const q = document.getElementById('buscador').value.toLowerCase().trim();
  const marca = document.getElementById('filtro-marca').value;
  return ITEMS.map((it, i) => ({ ...it, _idx: i })).filter(it => {
    if (marca && it.marca !== marca) return false;
    if (q) {
      const haystack = `${it.marca} ${it.modelo} ${it.calidad} ${it.color}`.toLowerCase();
      return haystack.includes(q);
    }
    return true;
  });
}

function render() {
  const items = filteredItems();
  const list = document.getElementById('list');
  document.getElementById('total-bar').textContent = `${items.length} ítems encontrados`;

  if (!items.length) {
    list.innerHTML = '<div class="empty-list">Sin resultados 🔍</div>';
    return;
  }

  // Agrupar por marca
  const grupos = {};
  items.forEach(it => {
    if (!grupos[it.marca]) grupos[it.marca] = [];
    grupos[it.marca].push(it);
  });

  list.innerHTML = '';
  Object.entries(grupos).forEach(([marca, its]) => {
    const g = document.createElement('div');
    g.className = 'marca-group';

    const mh = document.createElement('div');
    mh.className = 'marca-header';
    mh.textContent = marca;
    g.appendChild(mh);

    its.forEach(it => {
      const qty = pedido[it._idx] || 0;
      const div = document.createElement('div');
      div.className = 'item' + (qty > 0 ? ' selected' : '');
      div.innerHTML = `
        <div class="item-info">
          <div class="item-modelo">${it.modelo}</div>
          <div class="item-detalle">${it.calidad}${it.color ? ' · ' + it.color : ''}</div>
        </div>
        <div class="item-precio">USD ${it.precio % 1 === 0 ? it.precio.toFixed(0) : it.precio.toFixed(1)}</div>
        <div class="qty-ctrl">
          <button class="qty-btn" data-idx="${it._idx}" data-delta="-1">−</button>
          <div class="qty-val" id="qty-${it._idx}">${qty}</div>
          <button class="qty-btn" data-idx="${it._idx}" data-delta="1">＋</button>
        </div>
      `;
      g.appendChild(div);
    });

    list.appendChild(g);
  });

  // Evento delegado
  list.addEventListener('click', handleQty, { once: true });
  // Re-attach cada render via delegación global (abajo)
}

document.addEventListener('click', function(e) {
  const btn = e.target.closest('.qty-btn');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx);
  const delta = parseInt(btn.dataset.delta);
  pedido[idx] = Math.max(0, (pedido[idx] || 0) + delta);
  if (pedido[idx] === 0) delete pedido[idx];

  // Actualizar solo ese ítem visualmente
  const qtyEl = document.getElementById('qty-' + idx);
  if (qtyEl) {
    qtyEl.textContent = pedido[idx] || 0;
    const item = qtyEl.closest('.item');
    if (item) item.classList.toggle('selected', (pedido[idx] || 0) > 0);
  }

  actualizarBadge();
});

function actualizarBadge() {
  const total = Object.values(pedido).reduce((a, b) => a + b, 0);
  document.getElementById('badge').textContent = total;
}

function handleQty() {} // placeholder

function abrirModal() {
  renderModal();
  document.getElementById('modal').classList.add('open');
}
function cerrarModal() {
  document.getElementById('modal').classList.remove('open');
}

function renderModal() {
  const body = document.getElementById('modal-body');
  const keys = Object.keys(pedido).map(Number).filter(k => pedido[k] > 0);
  if (!keys.length) {
    body.innerHTML = '<div class="pedido-empty">Todavía no agregaste ítems al pedido.</div>';
    return;
  }
  body.innerHTML = keys.map(idx => {
    const it = ITEMS[idx];
    const q = pedido[idx];
    return `<div class="pedido-item">
      <div class="pedido-item-nombre">
        <strong>${it.marca} ${it.modelo}</strong><br>
        <span style="color:var(--text2);font-size:0.78rem">${it.calidad}${it.color ? ' · ' + it.color : ''}</span>
      </div>
      <div class="pedido-item-qty">×${q}</div>
    </div>`;
  }).join('');
}

function textoPedido() {
  const keys = Object.keys(pedido).map(Number).filter(k => pedido[k] > 0);
  if (!keys.length) return '';
  const lineas = keys.map(idx => {
    const it = ITEMS[idx];
    const q = pedido[idx];
    return `${q}x ${it.marca} ${it.modelo} - ${it.calidad}${it.color ? ' ' + it.color : ''}`;
  });
  return '*PEDIDO DE MÓDULOS*\n\n' + lineas.join('\n');
}

function copiarPedido() {
  const txt = textoPedido();
  if (!txt) return alert('El pedido está vacío.');
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('.btn-copiar');
    btn.textContent = '✅ Copiado';
    setTimeout(() => btn.textContent = '📋 Copiar', 1500);
  });
}

function enviarWhatsApp() {
  const txt = textoPedido();
  if (!txt) return alert('El pedido está vacío.');
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

function limpiarPedido() {
  if (!confirm('¿Limpiar todo el pedido?')) return;
  pedido = {};
  actualizarBadge();
  cerrarModal();
  render();
}

init();
</script>
</body>
</html>
